name: Build Windows Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyQt6-QtSvg pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all PyQt6 --name "GlassReminder" main.py

    - name: Setup Inno Setup
      uses: setup-innosetup/setup-innosetup@v2

    - name: Compile Inno Setup Script
      run: |
        iscc installer.iss

    - name: Upload Setup.exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GlassReminder-Windows-Setup
        path: Output/GlassReminder-Setup.exe
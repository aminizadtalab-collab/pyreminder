name: Build Windows & Linux Installers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyQt6-QtSvg pyinstaller

    - name: Build Standalone Executable
      run: |
        pyinstaller --noconsole --onefile --name "GlassReminder" main.py

    - name: Download & Run Inno Setup (Create Setup Wizard)
      run: |
        choco install innosetup -y
        iscc installer.iss

    - name: Upload Windows Setup.exe
      uses: actions/upload-artifact@v4
      with:
        name: GlassReminder-Windows-Installer
        path: Output/GlassReminder-Setup.exe
